name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --bins --examples
      - run: sh tests/smoke.sh target/release/niruwebapp
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: sh tests/x11-smoke.sh target/release/niruwebapp target/release/examples/x11-dummy | tee x11.log && grep -q PASS x11.log
